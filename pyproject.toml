[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Correctness rules, plus the comprehension and bug-bear checks that catch real
# mistakes. Deliberately NOT the style rules that would fight this project's
# conventions (see CLAUDE.md): no type hints, flat beginner-readable scripts, and
# model definitions duplicated across training scripts on purpose.
select = ["E4", "E7", "E9", "F", "B", "C4", "RUF"]

ignore = [
    # The project bans ternary expressions, so `x = a if c else b` rewrites are wrong here.
    "SIM108",
    # int() around numpy scalars is intentional: it converts np.int64 to a plain
    # int so CSV and JSON output does not carry numpy repr.
    "RUF046",
    # Unpacking a tuple and using part of it reads better than index juggling in
    # this codebase, e.g. `loss, probs, labels = run_epoch(...)` where a caller
    # only needs two of the three.
    "RUF059",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on structure; a few asserts read better as plain expressions.
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
